services:
  - type: web
    name: asoju-frontend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=frontend
    startCommand: npm run start --workspace=frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: 20
    autoDeploy: true
    branch: main
