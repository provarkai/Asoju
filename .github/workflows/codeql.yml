name: CodeQL

# Security checklist — "Integrate Automated Vulnerability Scanning".
# GitHub-native static analysis (SAST), free for this repo, no external
# account/token needed (unlike Snyk) — scans for real code-level
# vulnerability patterns (injection, unsafe deserialization, etc.), which
# `npm audit` (dependency-only) never catches. Findings land in the repo's
# Security tab, not as a build-failing gate — triage is a human decision,
# same reasoning as the audit-level=critical choice in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep catches newly-disclosed query patterns even with no
    # code changes, same cadence as Dependabot's dependency scan.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
