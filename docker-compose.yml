version: "3.9"

# Local dev infrastructure only. Managed cloud equivalents are used in
# staging/production per Section 11.2 of the Master PRD.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asoju
      POSTGRES_PASSWORD: asoju
      POSTGRES_DB: asoju
    ports:
      - "5432:5432"
    volumes:
      - asoju_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - asoju_redis_data:/data

  # Optional — an S3-compatible target for exercising the real evidence/
  # document upload path locally instead of the storage service's dry-run
  # mode. Not started by default (see the `minio` profile); to use it:
  #   docker compose --profile minio up -d
  #   docker exec -it asoju-minio-1 mc alias set local http://localhost:9000 asoju asojusecret
  #   docker exec -it asoju-minio-1 mc mb local/asoju-dev
  # then set S3_BUCKET=asoju-dev, S3_ENDPOINT=http://localhost:9000,
  # S3_FORCE_PATH_STYLE=true, S3_ACCESS_KEY_ID=asoju,
  # S3_SECRET_ACCESS_KEY=asojusecret in backend/.env.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asoju
      MINIO_ROOT_PASSWORD: asojusecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - asoju_minio_data:/data

volumes:
  asoju_postgres_data:
  asoju_redis_data:
  asoju_minio_data:
